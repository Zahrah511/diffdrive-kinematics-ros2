# ROS 2 <-> Gazebo bridge (ros_gz_bridge parameter_bridge).
# Run:  ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<path to this file>

# Simulation time -> ROS (so segment durations are in simulation seconds)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Wheel commands: ROS -> Gazebo (rad/s)
- ros_topic_name: "/left_wheel/cmd"
  gz_topic_name: "/diffbot/left_wheel/cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/right_wheel/cmd"
  gz_topic_name: "/diffbot/right_wheel/cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Measured wheel speeds: Gazebo -> ROS
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/sor_world/model/diffbot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# True pose (ground truth): Gazebo -> ROS
- ros_topic_name: "/ground_truth"
  gz_topic_name: "/model/diffbot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
